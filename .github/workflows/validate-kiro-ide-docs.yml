name: Validate kiro-ide-docs

# 対象ブランチは main のみ（D7）。develop 運用はしない。
on:
  push:
    branches: [ main ]
    paths:
      - 'kiro-ide-docs/**'
      - 'README.md'
      - 'scripts/kiro-ide-docs/**'
      - 'Makefile'
      - '.github/**'
      - 'AGENTS.md'
      - '.gitignore'
      - '.kiro/skills/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'kiro-ide-docs/**'
      - 'README.md'
      - 'scripts/kiro-ide-docs/**'
      - 'Makefile'
      - '.github/**'
      - 'AGENTS.md'
      - '.gitignore'
      - '.kiro/skills/**'
  schedule:
    # nightly。公式サイトの改廃によるリンク切れと、新バージョンの掲載漏れを検知する。
    # Kiro IDE は週次リリースのため、CLI 版より検知頻度を高く保つ必要がある。
    - cron: '47 18 * * *'
  workflow_dispatch:

# ⚠️ permissions を明示すると、書いていないスコープは none になる。
#    checkout に contents: read、掲載漏れの起票に issues: write が必要。
permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 公開範囲の機械検証。ローカル管理対象（work_plans / 05_meta /
      # 06_embedded-docs / work_records）が公開ツリーに混入していないかを見る。
      # 公開事故は取り返しがつかないので最初に実行する。
      - name: 公開範囲チェック（ローカル管理対象の混入）
        run: make check-kiro-ide-ignore

      # ネットワーク不要の全チェック（links / changelog / structure / coverage /
      # counts / notation / consistency）。
      - name: 全チェック（ネットワーク不要）
        run: make check-kiro-ide-all

      # ⚠️ 重要: CI には一次情報スナップショット（06_embedded-docs/）が無い。
      # .gitignore 対象のため clone されず、check-kiro-ide-coverage は
      # 「スキップして exit 0」になる。つまり **CI の green は網羅性を保証しない**。
      # 網羅性（版の取り落ち・日付のずれ・公式の説明の転記漏れ）は
      # スナップショットを持つローカル環境で確認する必要がある。
      # このステップは、その事実をログに残して誤読を防ぐためにある。
      - name: 網羅性チェックの状態を明示
        run: |
          if ls kiro-ide-docs/06_embedded-docs/*.html >/dev/null 2>&1; then
            echo "::notice::一次情報スナップショットがあるため網羅性を検証しました"
          else
            echo "::warning::一次情報スナップショット（06_embedded-docs/）が無いため" \
                 "網羅性チェックはスキップされました。CI の green は版の網羅性を保証しません。" \
                 "ローカルで make check-kiro-ide-coverage を実行してください"
          fi

      # 外部サイトに依存するチェックは PR では実行しない（レート制限・一時障害で
      # PR が赤くなるのを避ける）。push / nightly / 手動で実施する。
      # 重要 URL のみに絞ることで、外部要因の failure と本当のリンク切れを
      # 切り分けやすくする（全件は make check-kiro-ide-urls）。
      - name: 重要 URL の到達性（PR ではスキップ）
        if: github.event_name != 'pull_request'
        run: make check-kiro-ide-urls-important

      # 新バージョンの掲載漏れ検知。3情報源の和集合で判定する（M-F）。
      # 3値（0=変化なし・1=更新あり・3=未検証）を freshness-result 行から読み、
      # ステップ出力 rc に入れる。このステップ自体は失敗させない（判定は後続のステップで行う）。
      # ⚠️ shell: bash を必ず書く。省略すると `bash -e {0}` になり pipefail が効かず、
      #    `make … | tee` の失敗が握りつぶされる（2026-10-31 の run 41245477430 で、
      #    未掲載版2件を検知したのに success になった）。
      # ⚠️ !cancelled() にする。暗黙の success() だと、前のステップ（リンク切れなど）が
      #    失敗した夜に新版の検知まで止まる。
      - name: 新バージョン検知（nightly と手動のみ）
        id: freshness
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          make check-kiro-ide-cloud-freshness 2>&1 | tee "$RUNNER_TEMP/fresh.log" || true
          # sed は一致がなくても exit 0 を返すので、rc 行が無い場合も次の行に進み rc=3（未検証）になる
          rc=$(sed -n 's/^freshness-result: rc=\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/fresh.log" | tail -n 1)
          echo "rc=${rc:-3}" >> "$GITHUB_OUTPUT"
          echo "::notice title=freshness-result::rc=${rc:-3}"

      # 未掲載の版がある夜は run を失敗させ、Actions の失敗通知で利用者に知らせる。
      # ⚠️ ここでの failure は「文書のバグ」ではなく「更新作業が必要」の合図。
      # rc=3（未検証）は失敗させない（ネットワーク障害で毎晩赤くしないため。監視で扱う）。
      # 起票を有効にした後も残す（open の site-update Issue が残ると起票が止まるため。K-7 (a)）。
      - name: 更新検知を run の失敗として通知
        if: ${{ !cancelled() && steps.freshness.outputs.rc == '1' }}
        shell: bash
        run: |
          echo "::error title=freshness::公式に未掲載の版があります（rc=1）。版更新が必要です"
          exit 1

      # 掲載漏れを Issue にして `kiro` ラベルを付ける。ラベルが付くと
      # Kiro Web のクラウドセッションのタスクになり、更新 PR まで自動で流れる。
      #
      # ⚠️ ジョブ全体の failure() で判定してはいけない。リンク切れや
      #    urls-important の一時的失敗でも真になり、「掲載漏れ」Issue を誤起票して
      #    エージェントを誤起動させてしまう。freshness ステップの結果だけを見る。
      #
      # ⚠️ if: false で無効化してある。作業計画書 Phase 4-1 のドライランが通るまで
      #    有効化しない（有効化は `false &&` を削るだけ）。
      - name: 新版検知の失敗を Issue として起票（ドライラン後に有効化する）
        if: ${{ false && !cancelled() && steps.freshness.outputs.rc == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="新バージョンの掲載漏れを検知"
          body=$(printf '%s\n\n```\n%s\n```\n' \
            "nightly の check-kiro-ide-freshness が失敗しました。未掲載版を反映してください。" \
            "$(tail -40 "$RUNNER_TEMP/fresh.log")")
          # 既存の open issue があれば重複起票せずコメントを足す
          n=$(gh issue list --label kiro --search "$title in:title" --state open \
              --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --label kiro --body "$body"
          fi
